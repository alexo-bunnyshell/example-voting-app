<!DOCTYPE html>
<html ng-app="catsvsdogs" lang="en">
  <head>
    <meta charset="utf-8">
    <title>Live Results - Modern Voting App</title>
    <base href="/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="voting, results, real-time, modern-ui">
    <meta name="author" content="Bunnyshell Demo">
    <link rel='stylesheet' href='/stylesheets/style.css' />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body ng-controller="statsCtrl">
     <div id="background-stats">
       <div id="background-stats-1">
       </div><!--
      --><div id="background-stats-2">
      </div>
    </div>
    <div id="content-container">
      <div id="content-container-center">
        <div id="choice">
          <div class="choice cats">
            <div class="label"><i class="fa-solid fa-cat"></i> Cats</div>
            <div class="stat">{{aPercent | number:1}}%</div>
          </div>
          <div class="divider"></div>
          <div class="choice dogs">
            <div class="label"><i class="fa-solid fa-dog"></i> Dogs</div>
            <div class="stat">{{bPercent | number:1}}%</div>
          </div>
        </div>
      </div>
    </div>
    <div id="result">
      <span ng-if="total == 0"><i class="fa-solid fa-spinner fa-spin"></i> No votes yet</span>
      <span ng-if="total == 1"><i class="fa-solid fa-chart-simple"></i> {{total}} vote</span>
      <span ng-if="total >= 2"><i class="fa-solid fa-chart-simple"></i> {{total}} votes</span>
    </div>
    <script src="socket.io.js"></script>
    <script src="angular.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
